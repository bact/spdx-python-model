---
name: Publish API documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'README.md'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'gen/**'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e .
        # Use editable install (-e) to include the generated binding submodules
        # into the source tree so pdoc can see it.

      - name: Install pdoc
        run: pip install pdoc

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION_RAW="${{ github.event.release.tag_name }}"
            echo "VERSION=${VERSION_RAW#v}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi

      - name: Build docs
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          # Generate a list of all generated binding modules to pass to pdoc
          python - <<'PY' > docs_modules.txt
          import pkgutil
          from pathlib import Path

          bindings_dir = Path("src/spdx_python_model/bindings")
          modules = [
              f"spdx_python_model.bindings.{name}"
              for _, name, ispkg in pkgutil.iter_modules([str(bindings_dir)])
              if ispkg
          ]
          if not modules:
              raise SystemExit("No generated binding modules found")

          print("\n".join(modules))
          PY

          pdoc src/spdx_python_model $(cat docs_modules.txt) -o docs

          # Copy files to versioned/dev directory
          mkdir -p "pages/${{ env.VERSION }}"
          cp -r docs/* "pages/${{ env.VERSION }}/"

          # Publish a latest alias for the latest release docs.
          if [[ "${{ env.VERSION }}" != "dev" ]]; then
            rm -rf pages/latest
            mkdir -p pages/latest
            cp -r docs/* pages/latest/
          elif [[ ! -d pages/latest ]]; then
            mkdir -p pages/latest
            cp -r docs/* pages/latest/
          fi

          # Create an index.html to redirect to the latest release docs.
          echo '<meta http-equiv="refresh" content="0; url=latest/" />' > pages/index.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
