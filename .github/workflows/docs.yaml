---
name: Publish API docs

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'README.md'
      - '.github/workflows/docs.yaml'
      - 'pyproject.toml'
      - 'gen/**'
      - 'docs/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e .
        # Use editable install (-e) to include the generated binding submodules
        # into the source tree so pdoc can see them.

      - name: Install pdoc
        run: pip install pdoc

      - name: Get version
        id: get_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION_RAW="${{ github.event.release.tag_name }}"
            echo "VERSION=${VERSION_RAW#v}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi

      - name: Build docs
        run: |
          VERSION="${{ env.VERSION }}"
          OUT="pages/docs/$VERSION"

          # Build API docs directly into the versioned output directory.
          pdoc spdx_python_model \
            --logo "https://raw.githubusercontent.com/spdx/outreach/main/assets/SPDX_Logo/svg/SPDX%20logo%20color.svg" \
            --logo-link "https://github.com/spdx/spdx-python-model" \
            --footer-text "spdx-python-model $VERSION" \
            -o "$OUT"

          # For releases, also publish as "latest".
          if [[ "$VERSION" != "dev" ]]; then
            rm -rf pages/docs/latest
            cp -r "$OUT" pages/docs/latest
          fi

          # Root index.html redirects to docs/latest/.
          echo '<meta http-equiv="refresh" content="0; url=docs/latest/" />' > pages/index.html

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
